[project]
name = "archon-vision"
version = "0.1.0"
description = "MCP server providing image understanding capabilities for AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0,<3",
    "httpx>=0.27.0,<1",
    "python-dotenv>=1.0.0,<2",
]

[project.scripts]
archon-vision = "server.main:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10"]
