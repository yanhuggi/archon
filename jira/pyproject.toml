[project]
name = "archon-jira"
version = "0.1.0"
description = "MCP server providing Jira issue tracking capabilities for AI agents"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "python-docx>=1.0.0",
]

[project.scripts]
archon-jira = "server.main:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
