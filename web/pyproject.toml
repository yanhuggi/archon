[project]
name = "archon-web"
version = "0.1.0"
description = "MCP server for focused, no-key public web search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0,<3",
    "python-dotenv>=1.0.0,<2",
    "ddgs>=9,<10",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
archon-web = "server.main:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
