[project]
name = "archon-web"
version = "0.1.0"
description = "MCP server providing web search capabilities for AI agents"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
duckduckgo = ["duckduckgo-search>=7"]

[project.scripts]
archon-web = "server.main:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
